# sudo ln -s /etc/nginx/sites-available/t1d-explorer /etc/nginx/sites-enabled/
# sudo rm /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
# For HTTPS (needs a domain name pointing at the instance): sudo certbot --nginx -d your.domain
server {
    listen 80;
    server_name _;               # replace with your domain
    client_max_body_size 1m;
    gzip on;
    gzip_types application/json application/javascript text/css;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
